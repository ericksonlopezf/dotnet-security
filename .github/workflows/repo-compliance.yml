name: Repository Compliance & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  compliance-audit:
    name: Compliance & Architecture Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Run Architecture & Rules Compliance Script
        shell: pwsh
        run: ./scripts/verify-compliance.ps1

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.Security.slnx

      - name: Build with Strict Diagnostics (TreatWarningsAsErrors)
        run: dotnet build EricksonLopez.Security.slnx --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test EricksonLopez.Security.slnx --no-build --configuration Release --verbosity normal

      - name: Validate NuGet Packages Packaging
        run: dotnet pack EricksonLopez.Security.slnx --no-build --configuration Release -o artifacts/
