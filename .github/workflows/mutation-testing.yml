name: Mutation Testing (Stryker)

# ─── Purpose ─────────────────────────────────────────────────────────────────
# Runs Stryker.NET mutation testing across all functional EricksonLopez.Security packages:
#   • Core Library (EricksonLopez.Security)
#   • Abstractions (EricksonLopez.Security.Abstractions)
#   • Analyzers (EricksonLopez.Security.Analyzers)
#   • AspNetCore (EricksonLopez.Security.AspNetCore)
#   • Aws (EricksonLopez.Security.Aws)
#   • Azure (EricksonLopez.Security.Azure)
#   • Cryptography (EricksonLopez.Security.Cryptography)
#   • Cryptography.Pkcs11 (EricksonLopez.Security.Cryptography.Pkcs11)
#   • Cryptography.XmlDSig (EricksonLopez.Security.Cryptography.XmlDSig)
#   • GoogleCloud (EricksonLopez.Security.GoogleCloud)
#   • HashiCorpVault (EricksonLopez.Security.HashiCorpVault)
#   • Mfa (EricksonLopez.Security.Mfa)
#   • Network (EricksonLopez.Security.Network)
#   • OpenTelemetry (EricksonLopez.Security.OpenTelemetry)
#   • Pki (EricksonLopez.Security.Pki)
#   • Privacy.Hibp (EricksonLopez.Security.Privacy.Hibp)
#   • Saml2 (EricksonLopez.Security.Saml2)
#   • WebAuthn.Fido2 (EricksonLopez.Security.WebAuthn.Fido2)
#   • WebAuthn.Fido2.Mds3 (EricksonLopez.Security.WebAuthn.Fido2.Mds3)
#   • ZeroTrust (EricksonLopez.Security.ZeroTrust)
#
# Threshold policy (single source of truth defined in stryker-*.json):
#   • high  (≥100%) — ✅ HIGH
#   • low   (≥ 98%) — 🟡 LOW
#   • warn  (≥ 95%) — 🟠 WARNING (approaching break threshold)
#   • break (< 95%) — ❌ FAILED (Stryker exits with non-zero code)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      mutation-level:
        description: "Stryker mutation level (Basic, Standard, Advanced)"
        required: false
        default: "Standard"
        type: choice
        options:
          - Basic
          - Standard
          - Advanced
  workflow_call:
    inputs:
      mutation-level:
        description: "Stryker mutation level (Basic, Standard, Advanced)"
        required: false
        default: "Standard"
        type: string
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday at 04:00 UTC

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  mutation-test:
    name: Stryker — ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core
            config: stryker-config.json
            output-dir: StrykerOutput/core
            artifact-name: stryker-report-core
          - name: Abstractions
            config: stryker-abstractions-config.json
            output-dir: StrykerOutput/abstractions
            artifact-name: stryker-report-abstractions
          - name: Analyzers
            config: stryker-analyzers-config.json
            output-dir: StrykerOutput/analyzers
            artifact-name: stryker-report-analyzers
          - name: AspNetCore
            config: stryker-aspnetcore-config.json
            output-dir: StrykerOutput/aspnetcore
            artifact-name: stryker-report-aspnetcore
          - name: Aws
            config: stryker-aws-config.json
            output-dir: StrykerOutput/aws
            artifact-name: stryker-report-aws
          - name: Azure
            config: stryker-azure-config.json
            output-dir: StrykerOutput/azure
            artifact-name: stryker-report-azure
          - name: Cryptography
            config: stryker-cryptography-config.json
            output-dir: StrykerOutput/cryptography
            artifact-name: stryker-report-cryptography
          - name: CryptographyPkcs11
            config: stryker-cryptography-pkcs11-config.json
            output-dir: StrykerOutput/cryptographypkcs11
            artifact-name: stryker-report-cryptographypkcs11
          - name: CryptographyXmlDSig
            config: stryker-cryptography-xmldsig-config.json
            output-dir: StrykerOutput/cryptographyxmldsig
            artifact-name: stryker-report-cryptographyxmldsig
          - name: GoogleCloud
            config: stryker-googlecloud-config.json
            output-dir: StrykerOutput/googlecloud
            artifact-name: stryker-report-googlecloud
          - name: HashiCorpVault
            config: stryker-hashicorpvault-config.json
            output-dir: StrykerOutput/hashicorpvault
            artifact-name: stryker-report-hashicorpvault
          - name: Mfa
            config: stryker-mfa-config.json
            output-dir: StrykerOutput/mfa
            artifact-name: stryker-report-mfa
          - name: Network
            config: stryker-network-config.json
            output-dir: StrykerOutput/network
            artifact-name: stryker-report-network
          - name: OpenTelemetry
            config: stryker-opentelemetry-config.json
            output-dir: StrykerOutput/opentelemetry
            artifact-name: stryker-report-opentelemetry
          - name: Pki
            config: stryker-pki-config.json
            output-dir: StrykerOutput/pki
            artifact-name: stryker-report-pki
          - name: PrivacyHibp
            config: stryker-privacy-hibp-config.json
            output-dir: StrykerOutput/privacyhibp
            artifact-name: stryker-report-privacyhibp
          - name: Saml2
            config: stryker-saml2-config.json
            output-dir: StrykerOutput/saml2
            artifact-name: stryker-report-saml2
          - name: WebAuthnFido2
            config: stryker-webauthn-fido2-config.json
            output-dir: StrykerOutput/webauthnfido2
            artifact-name: stryker-report-webauthnfido2
          - name: WebAuthnFido2Mds3
            config: stryker-webauthn-fido2-mds3-config.json
            output-dir: StrykerOutput/webauthnfido2mds3
            artifact-name: stryker-report-webauthnfido2mds3
          - name: Testing
            config: stryker-testing-config.json
            output-dir: StrykerOutput/testing
            artifact-name: stryker-report-testing
          - name: ZeroTrust
            config: stryker-zerotrust-config.json
            output-dir: StrykerOutput/zerotrust
            artifact-name: stryker-report-zerotrust

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.Security.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.Security.slnx --no-restore --configuration Release

      - name: Install Stryker
        # SC-SUPPLY-01 (resolved): pinned to explicit version to prevent silent breakage from major upgrades
        run: dotnet tool install --global dotnet-stryker --version 5.0.0

      - name: Run Stryker (${{ matrix.name }})
        id: stryker
        run: |
          set +e
          dotnet-stryker \
            --config-file ${{ matrix.config }} \
            --mutation-level ${{ inputs.mutation-level || 'Standard' }} \
            --concurrency 2 \
            --output ${{ github.workspace }}/${{ matrix.output-dir }}
          STRYKER_EXIT_CODE=$?
          echo "exit_code=$STRYKER_EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Stryker finished with exit code: $STRYKER_EXIT_CODE"
          exit 0

      - name: Upload Stryker report (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact-name }}-${{ github.run_id }}
          path: ${{ matrix.output-dir }}/
          retention-days: 30

      # ─── Extract and report mutation score ───────────────────────────────
      - name: Extract and report mutation score (${{ matrix.name }})
        id: report
        if: always()
        run: node scripts/record-stryker-result.js "${{ matrix.output-dir }}" "${{ matrix.name }}" "${{ matrix.config }}"

      - name: Upload summary JSON (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stryker-summary-${{ matrix.name }}
          path: StrykerOutput/summary-${{ matrix.name }}.json
          retention-days: 30

      - name: Enforce Stryker exit code (${{ matrix.name }})
        if: always()
        run: |
          if [ "${{ steps.stryker.outputs.exit_code }}" != "0" ]; then
            echo "❌ Stryker execution failed for ${{ matrix.name }} with exit code ${{ steps.stryker.outputs.exit_code }}"
            exit ${{ steps.stryker.outputs.exit_code }}
          fi

  # ─── Consolidated Gate Aggregation & Commit Status ───────────────────────────
  mutation-gate-summary:
    name: Consolidated Quality Gate & Commit Status
    runs-on: ubuntu-latest
    needs: mutation-test
    if: always()
    permissions:
      contents: write
      statuses: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all summary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stryker-summary-*
          path: ./all-summaries
          merge-multiple: true

      - name: Evaluate Consolidated Mutation Quality Gate
        id: eval-gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const summariesDir = path.join(process.cwd(), 'all-summaries');
            function findSummaryFiles(dir) {
              let results = [];
              if (!fs.existsSync(dir)) return results;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  results = results.concat(findSummaryFiles(fullPath));
                } else if (entry.isFile() && entry.name.startsWith('summary-') && entry.name.endsWith('.json')) {
                  results.push(fullPath);
                }
              }
              return results;
            }

            const summaryFiles = findSummaryFiles(summariesDir);

            console.log(`Found ${summaryFiles.length} summary files in ${summariesDir}`);

            const packages = [];
            let totalKilled = 0;
            let totalMutants = 0;
            let allPassed = summaryFiles.length > 0;
            let breakThreshold = 95;

            for (const file of summaryFiles) {
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                packages.push(data);
                totalKilled += data.mutants_killed || data.killed || 0;
                totalMutants += data.total_mutants || data.total || 0;
                if (!data.passed_break && !data.passed) {
                  allPassed = false;
                }
              } catch (e) {
                console.error(`Error reading ${file}:`, e.message);
                allPassed = false;
              }
            }

            const overallScore = totalMutants > 0 ? ((totalKilled / totalMutants) * 100).toFixed(2) : "0.00";
            const numScore = parseFloat(overallScore);

            let statusLabel = '❌ FAILED';
            if (allPassed && totalMutants > 0 && numScore >= 100) {
              statusLabel = '✅ HIGH';
            } else if (allPassed && totalMutants > 0 && numScore >= 98) {
              statusLabel = '🟡 LOW';
            } else if (allPassed && totalMutants > 0 && numScore >= breakThreshold) {
              statusLabel = '🟠 WARNING';
            } else {
              statusLabel = '❌ FAILED';
              allPassed = false;
            }

            console.log(`Consolidated Score: ${overallScore}%`);
            const execDate = new Date().toISOString();

            // Append Consolidated Summary Table to Step Summary
            let md = `\n# 🛡️ Consolidated Stryker Mutation Testing Gate\n\n`;
            md += `| Metric | Value |\n`;
            md += `|--------|-------|\n`;
            md += `| **Overall Mutation Score** | **${overallScore}%** |\n`;
            md += `| **Mutants Killed** | ${totalKilled} |\n`;
            md += `| **Total Mutants** | ${totalMutants} |\n`;
            md += `| **Threshold High** | ≥100% |\n`;
            md += `| **Threshold Low** | ≥98% |\n`;
            md += `| **Threshold Break** | ≥${breakThreshold}% |\n`;
            md += `| **Overall Status** | ${statusLabel} |\n`;
            md += `| **Commit SHA** | \`${context.sha.substring(0, 7)}\` (\`${context.sha}\`) |\n`;
            md += `| **Execution Date** | ${execDate} |\n\n`;

            md += `### Package Breakdown\n\n`;
            md += `| Package | Score | Killed / Total | Status |\n`;
            md += `|---------|-------|----------------|--------|\n`;
            for (const p of packages) {
              md += `| **${p.package}** | **${p.mutation_score || p.score}%** | ${p.mutants_killed || p.killed}/${p.total_mutants || p.total} | ${p.status} |\n`;
            }
            md += `| **OVERALL** | **${overallScore}%** | **${totalKilled}/${totalMutants}** | **${statusLabel}** |\n\n`;
            md += `**Gate Verdict**: ${allPassed ? '✅ PASSED' : '❌ FAILED'} (Break Threshold: ≥${breakThreshold}%)\n`;

            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath && fs.existsSync(path.dirname(summaryPath))) {
              fs.appendFileSync(summaryPath, md, 'utf8');
            }

            // Post GitHub Commit Status
            const targetSha = context.sha;
            const state = allPassed ? 'success' : 'failure';
            const description = `Score: ${overallScore}% (${packages.filter(p => p.passed_break || p.passed).length}/${packages.length} packages >= ${breakThreshold}%) - ${statusLabel}`;

            console.log(`Publishing commit status for ${targetSha}: state=${state}, description="${description}"`);

            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: targetSha,
                state: state,
                context: 'mutation-testing/stryker',
                description: description.substring(0, 140),
                target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
              console.log('✅ Successfully created commit status mutation-testing/stryker');
            } catch (err) {
              console.error('⚠️ Failed to create commit status:', err.message);
            }

            // Update README.md badge with rounded-up integer score if gate passed
            if (allPassed) {
              const roundedScore = Math.ceil(parseFloat(overallScore));
              const badgeColor = roundedScore >= 98 ? 'brightgreen' : (roundedScore >= 90 ? 'green' : 'yellow');
              const readmePath = 'README.md';
              if (fs.existsSync(readmePath)) {
                const readme = fs.readFileSync(readmePath, 'utf8');
                const updatedReadme = readme.replace(
                  /(img\.shields\.io\/badge\/Mutation_Score-)[^?-]+-[a-z]+(\?[^)\s]*)/g,
                  (m, p1, p2) => `${p1}${roundedScore}%25-${badgeColor}${p2}`
                );

                if (updatedReadme !== readme) {
                  fs.writeFileSync(readmePath, updatedReadme, 'utf8');
                  console.log(`📝 Updated README.md with Mutation Score: ${roundedScore}%`);
                  try {
                    const { execSync } = require('child_process');
                    execSync('git config user.name "github-actions[bot]"', { stdio: 'inherit' });
                    execSync('git config user.email "github-actions[bot]@users.noreply.github.com"', { stdio: 'inherit' });
                    execSync('git add README.md', { stdio: 'inherit' });
                    execSync(`git commit -m "docs: update mutation score badge to ${roundedScore}% [skip ci]"`, { stdio: 'inherit' });
                    execSync('git push origin HEAD:main', { stdio: 'inherit' });
                    console.log(`🚀 Successfully committed and pushed README.md mutation score badge (${roundedScore}%)`);
                  } catch (gitErr) {
                    console.error('⚠️ Could not push README update:', gitErr.message);
                  }
                } else {
                  console.log(`ℹ️ README.md already contains mutation score badge for ${roundedScore}%`);
                }
              }
            }

            if (!allPassed) {
              core.setFailed(`Consolidated Stryker Mutation Testing Gate failed: score=${overallScore}%, passed=${allPassed}`);
            }
