name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  compliance-audit:
    name: Compliance & Governance Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Repository Compliance Verifier
        shell: pwsh
        run: ./scripts/verify-compliance.ps1

  build-and-test:
    needs: [compliance-audit]
    uses: ./.github/workflows/dotnet-build-test.yml
    with:
      artifact-name: test-results
    secrets:
      SNK_KEY: ${{ secrets.SNK_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─── NativeAOT Smoke Test ─────────────────────────────────────────────────
  # Validates that IsAotCompatible=true is genuine — the packages compile
  # and run under NativeAOT (PublishAot=true) on Linux.
  aot-smoke-test:
    needs: [compliance-audit]
    uses: ./.github/workflows/aot-smoke-test.yml
    secrets:
      SNK_KEY: ${{ secrets.SNK_KEY }}
